# Site settings
title: Nils Duran
author: Nils Duran
description: "MSc Data Science Student & AI Engineer | UPC"
baseurl: ""
url: "https://nilsduran.github.io"
date_format: "%b %-d, %Y"

# Google services
google_verification:
google_analytics:
google_tag_manager:
bing_verification:

# Optional features
show_related_posts: False
show_post_footers: False
show_subscribe_cta: False
show_social_icons: false
ajaxify_contact_form: false
enable_mathjax: true
extended_fonts: false
enable_anchorjs: true

# Social icons
github_username: nilsduran
linkedin_username: nils-duran2004

text:
  post:
    updated: "Updated"
    minute_read: '🕒 min read'
    related_posts: "You might also like"
  index:
    coming_soon: "Coming soon..."

# Build settings
markdown: kramdown
redcarpet:
  extensions: ["smart", "tables", "with_toc_data", "footnotes"]
permalink: pretty
sass:
  sass_dir: _sass
  style: compressed

collections:
  projects:
    output: true
    permalink: /projects/:name/

kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      read_time: true
      comments: true
      share: false
      author: Nils Duran
      avatar: /images/misc/headshot.jpg
      tags: []
  # _projects
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      read_time: true
      comments: false
      share: false
      author: Nils Duran
      avatar: /images/misc/headshot.jpg
      tags: []
